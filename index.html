<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A1F" media="(prefers-color-scheme: dark)">
<title>稼働報告</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23C13B2A' stroke-width='6'/%3E%3Ctext x='32' y='42' font-size='28' font-weight='900' text-anchor='middle' fill='%23C13B2A'%3E%E7%A8%BC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EF; --sheet:#FFFFFF; --ink:#1D2A36; --muted:#5D6A75; --line:#CDD5D2;
  --shu:#C13B2A;
  --st-work:#2E6A4C; --st-absent:#8C2F3D; --st-late:#9A5A0C; --st-early:#355A8E; --st-out:#2C6468; --st-leave:#6B4E8C; --on-tone:#FFFFFF;
  --ok-bg:#E6F1EA; --ng-bg:#F7E6E6;
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#131A1F; --sheet:#1B242B; --ink:#E6ECEA; --muted:#9BA7AF; --line:#33414B;
    --shu:#E5654F;
    --st-work:#62B58A; --st-absent:#DA7584; --st-late:#E2A24C; --st-early:#82A3D8; --st-out:#6DB9BD; --st-leave:#B79AD8; --on-tone:#10171C;
    --ok-bg:#1D3328; --ng-bg:#3A2226;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--st-early);outline-offset:2px}

.view{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.brand{font-weight:900;letter-spacing:.04em}

/* ログイン */
.login-card{margin-top:10vh;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:28px 22px}
.login-card h1{font-size:1.75rem;margin:0 0 4px}
.lead{color:var(--muted);font-size:.875rem;margin:0 0 22px}
.note{font-size:.75rem;color:var(--muted);margin:18px 0 0}

/* ヘッダー */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;padding:2px 2px 14px;flex-wrap:wrap}
.top .brand{font-size:1.125rem}
.who{display:flex;gap:14px;align-items:baseline;font-size:.875rem;color:var(--muted);flex-wrap:wrap}
.who #userName{color:var(--ink);font-weight:700}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.8125rem}

.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card.loading{opacity:.55;pointer-events:none}

/* 日付 */
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.nav{flex:none;width:40px;height:40px;border:1px solid var(--line);background:var(--sheet);border-radius:50%;font-size:1.25rem;line-height:1;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.date-pick{position:relative;flex:1;text-align:center;cursor:pointer;min-width:0;color:var(--ink)}
.date-label{font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
.date-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.today{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:.8125rem;cursor:pointer}

[data-tone="work"]{--tone:var(--st-work)}
[data-tone="absent"]{--tone:var(--st-absent)}
[data-tone="late"]{--tone:var(--st-late)}
[data-tone="early"]{--tone:var(--st-early)}
[data-tone="out"]{--tone:var(--st-out)}

/* その日の記録 */
.daysum{position:relative;background:var(--paper);border-radius:10px;padding:12px 104px 12px 14px;margin-bottom:6px;min-height:92px}
.ds{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:baseline}
.ds + .ds{margin-top:8px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--on-tone);background:var(--tone);border-radius:4px;padding:1px 7px;letter-spacing:.06em;white-space:nowrap}
.ds-main{font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ds-sub{grid-column:2;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp{position:absolute;right:10px;top:50%;width:80px;height:80px;margin-top:-40px;border-radius:50%;
  border:3px solid var(--shu);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--shu);
  color:var(--shu);display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-12deg);pointer-events:none;line-height:1.15}
.stamp b{font-size:1.2rem;font-weight:900;letter-spacing:.12em;margin-left:.12em}
.stamp small{font-size:.625rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.stamp.pop{animation:stamp .3s cubic-bezier(.2,.9,.3,1.25)}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.9);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.daymsg{font-size:.8125rem;color:var(--muted);background:var(--paper);border-radius:8px;padding:10px 12px;margin:6px 0 0}
.daymsg:empty{display:none}

/* 出勤・退勤のパネル */
.panel{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph h2{font-size:1.0625rem;margin:0;font-weight:900;letter-spacing:.06em}
.badge{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.badge.done{color:var(--ink);font-weight:700}
.ph .link{margin-left:auto}
.lock{font-size:.8125rem;color:var(--muted);margin:0}

.statuses{display:grid;gap:8px;margin-bottom:14px}
.statuses.three{grid-template-columns:repeat(3,1fr)}
.statuses.two{grid-template-columns:repeat(2,1fr)}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;
  padding:10px 10px 9px 12px;min-height:66px;border:1px solid var(--line);border-left:6px solid var(--tone);
  border-radius:10px;background:var(--sheet);cursor:pointer;transition:background-color .15s,color .15s}
.st b{font-size:1.25rem;font-weight:900;letter-spacing:.1em;line-height:1.3}
.st span{font-size:.6875rem;color:var(--muted);line-height:1.4}
.st[aria-pressed="true"]{background:var(--tone);border-color:var(--tone);color:var(--on-tone)}
.st[aria-pressed="true"] span{color:inherit;opacity:.85}
.st:disabled{opacity:.3;cursor:not-allowed}

label{display:flex;flex-direction:column;gap:4px;font-size:.8125rem;color:var(--muted);font-weight:500}
.lbl{display:flex;align-items:center;gap:6px}
.req{font-size:.6875rem;font-weight:700;color:#fff;background:var(--st-absent);border-radius:3px;padding:0 5px}
.opt{font-size:.6875rem;opacity:.85}
select,input,textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--sheet);font-size:1rem;color:var(--ink);min-height:46px;width:100%}
select{font-variant-numeric:tabular-nums}
textarea{resize:vertical;line-height:1.5;min-height:64px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.worked{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding-bottom:6px}
.worked span{font-size:.8125rem;color:var(--muted)}
.worked output{font-size:1.25rem;font-weight:900;font-variant-numeric:tabular-nums}

.geo{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;margin:-4px 0 12px;font-size:.8125rem;background:var(--paper);color:var(--muted)}
.geo .ic{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;margin-top:1px;background:var(--line);color:var(--sheet)}
.geo.ok{background:var(--ok-bg);color:var(--ink)} .geo.ok .ic{background:var(--st-work)}
.geo.ng{background:var(--ng-bg);color:var(--ink)} .geo.ng .ic{background:var(--st-absent)}
.geo.loading .ic{background:none;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.geo .gt{flex:1}
.geo .link{white-space:nowrap}

.primary{width:100%;border:0;border-radius:10px;background:var(--ink);color:var(--sheet);font-weight:700;font-size:1.0625rem;padding:15px;cursor:pointer;letter-spacing:.06em}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{border:1px solid var(--line);background:none;border-radius:10px;padding:12px 16px;cursor:pointer}
.error{color:var(--st-absent);font-size:.875rem;margin:0 0 10px;font-weight:500}
.error:empty{display:none}
form label{margin-bottom:14px}

/* 今月の稼働 */
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hist-head h2{font-size:1.0625rem;margin:0}
.summary{color:var(--muted);font-size:.8125rem;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.summary:empty{display:none}
.summary span{display:inline-block;white-space:nowrap;margin-right:1em}
.summary .warn{color:var(--st-absent);font-weight:700}
.days{list-style:none;margin:8px 0 0;padding:0}
.days li + li{border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:5.4em 4.6em 1fr auto;align-items:center;gap:8px;width:100%;
  background:none;border:0;padding:10px 4px;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums;border-radius:6px}
.day[aria-current="date"]{background:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chips .tag{font-size:.6875rem;padding:0 5px}
.day .t{color:var(--muted);font-size:.8125rem;line-height:1.35}
.day .t small{display:block;font-size:.6875rem}
.day .w{font-weight:700}
.empty{color:var(--muted);font-size:.875rem;padding:14px 0}

dialog{border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--sheet);color:var(--ink);width:min(92vw,400px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{font-size:1.125rem;margin:0 0 16px}
.row{display:flex;gap:10px;justify-content:flex-end}
.row .primary{width:auto;padding:12px 18px;font-size:1rem}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);background:var(--ink);color:var(--sheet);
  padding:12px 16px;border-radius:10px;font-size:.875rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  width:max-content;max-width:min(92vw,480px)}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* タブ */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px;position:sticky;top:6px;z-index:5}
.tab{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:.9375rem;color:var(--muted);cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
.tab .cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--shu);color:#fff;font-size:.6875rem;margin-left:4px;padding:0 5px;vertical-align:1px}
.planline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8125rem;color:var(--muted);margin:-6px 0 12px;justify-content:center}
.planline:empty{display:none}
.planline b{color:var(--ink)}
[data-tone="leave"]{--tone:var(--st-leave)}
[data-tone="wish"]{--tone:var(--st-late)}
[data-tone="fixed"]{--tone:var(--st-work)}
/* 予定 */
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin:8px 0 4px}
.pdays{list-style:none;margin:6px 0 0;padding:0}
.pdays li + li{border-top:1px solid var(--line)}
.pday{display:grid;grid-template-columns:24px 5.4em 1fr;align-items:center;gap:8px;width:100%;background:none;border:0;padding:9px 4px;text-align:left;cursor:pointer;border-radius:6px;font-variant-numeric:tabular-nums}
.pday:disabled{cursor:default}
.pday .ck{width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;color:var(--sheet)}
.pday:disabled .ck{visibility:hidden}
.pday[aria-pressed="true"]{background:var(--paper)}
.pday[aria-pressed="true"] .ck{background:var(--ink);border-color:var(--ink)}
.pday.off .pd{color:var(--muted)}
.pday .pv{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:.875rem}
.pday .pv small{color:var(--muted);font-size:.75rem}
.pday .tag{font-size:.6875rem;padding:0 5px}
.editor{position:sticky;bottom:8px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:12px;padding:14px;margin-top:12px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.editor .eh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;font-size:.875rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:9px 4px;font-weight:700;cursor:pointer;font-size:.875rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.hint{font-size:.75rem;color:var(--muted);margin:8px 0 0}
/* 申請 */
.bal{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.bal .big{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.bal small{color:var(--muted);font-size:.8125rem}
.rtypes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rtypes .st{min-height:54px}
.reqs{list-style:none;margin:6px 0 0;padding:0}
.reqs li{border-top:1px solid var(--line);padding:11px 2px}
.reqs li:first-child{border-top:0}
.rq-h{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.rq-b{font-weight:700;font-size:.9375rem;font-variant-numeric:tabular-nums}
.rq-n,.rq-c{font-size:.8125rem;color:var(--muted);overflow-wrap:anywhere}
.rq-c{color:var(--ink)}
.rq-f{display:flex;justify-content:space-between;align-items:baseline;font-size:.75rem;color:var(--muted);margin-top:4px}
.stt{font-size:.6875rem;font-weight:700;border-radius:999px;padding:1px 8px;border:1.5px solid currentColor;margin-left:auto}
.stt.s-申請中{color:var(--st-late)} .stt.s-承認{color:var(--st-work)} .stt.s-却下{color:var(--st-absent)} .stt.s-取消{color:var(--muted)}

@media (max-width:380px){
  .st b{font-size:1.1rem} .date-label{font-size:1.25rem}
  .daysum{padding-right:92px} .stamp{width:70px;height:70px;margin-top:-35px} .stamp b{font-size:1.05rem}
  .day{grid-template-columns:5em 4.2em 1fr auto;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main id="login" class="view" hidden>
  <div class="login-card">
    <h1 class="brand">稼働報告</h1>
    <p class="lead">登録済みのメールアドレスとパスワードでログインしてください。</p>
    <form id="loginForm" novalidate>
      <label>メールアドレス<input type="email" id="loginEmail" autocomplete="username" inputmode="email" required></label>
      <label>パスワード<input type="password" id="loginPass" autocomplete="current-password" required></label>
      <p class="error" id="loginError" role="alert"></p>
      <button class="primary" type="submit" id="loginBtn">ログイン</button>
    </form>
    <p class="note">パスワードを忘れた場合は、管理者（kanri@blks.site）に再設定を依頼してください。</p>
  </div>
</main>

<div id="app" class="view" hidden>
  <header class="top">
    <span class="brand">稼働報告</span>
    <div class="who">
      <span id="userName"></span>
      <button type="button" class="link" id="pwBtn">パスワード変更</button>
      <button type="button" class="link" id="logoutBtn">ログアウト</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="メニュー">
    <button type="button" class="tab" role="tab" data-tab="punch" aria-selected="true">打刻</button>
    <button type="button" class="tab" role="tab" data-tab="plan" aria-selected="false">予定</button>
    <button type="button" class="tab" role="tab" data-tab="req" aria-selected="false">申請<span class="cnt" id="reqCnt" hidden></span></button>
  </nav>

  <div id="viewPunch">
  <section class="card" id="entry" aria-labelledby="dateLabel">
    <div class="datebar">
      <button type="button" class="nav" id="prevDay" aria-label="前の日">‹</button>
      <label class="date-pick">
        <span class="date-label" id="dateLabel"></span>
        <input type="date" id="dateInput" aria-label="日付を選ぶ">
      </label>
      <button type="button" class="nav" id="nextDay" aria-label="次の日">›</button>
      <button type="button" class="today" id="todayBtn">今日</button>
    </div>
    <div class="planline" id="planLine"></div>

    <div class="daysum" id="daySum" hidden>
      <div class="ds" id="dsIn"><span class="tag" id="dsInTag"></span><span class="ds-main" id="dsInMain"></span><span class="ds-sub" id="dsInSub"></span></div>
      <div class="ds" id="dsOut"><span class="tag" id="dsOutTag"></span><span class="ds-main" id="dsOutMain"></span><span class="ds-sub" id="dsOutSub"></span></div>
      <div class="stamp" id="stamp" aria-hidden="true"><b id="stampStatus"></b><small id="stampTime"></small></div>
    </div>
    <p class="daymsg" id="dayMsg"></p>

    <!-- 出勤 -->
    <div class="panel" id="inPanel">
      <div class="ph"><h2>出勤</h2><span class="badge" id="inBadge"></span><button type="button" class="link" id="inEdit">修正する</button></div>
      <div id="inBody">
        <div class="statuses three" role="group" aria-label="出勤のステータス">
          <button type="button" class="st" data-in="出勤" data-tone="work" aria-pressed="false"><b>出勤</b><span>予定どおり</span></button>
          <button type="button" class="st" data-in="遅刻" data-tone="late" aria-pressed="false"><b>遅刻</b><span>開始が遅れた</span></button>
          <button type="button" class="st" data-in="欠勤" data-tone="absent" aria-pressed="false"><b>欠勤</b><span>終日お休み</span></button>
        </div>
        <div id="inFields">
          <label class="field">勤務場所<select id="place"></select></label>
          <div class="geo" id="geo" role="status"><span class="ic" id="geoIc"></span><span class="gt" id="geoText"></span><button type="button" class="link" id="geoRetry">取得し直す</button></div>
          <label class="field">出勤時刻<select id="start"></select></label>
        </div>
        <label class="field"><span class="lbl">理由・備考<span class="req" id="inReq">必須</span><span class="opt" id="inOpt">任意</span></span>
          <textarea id="inNote" rows="2" placeholder="遅刻・欠勤の理由など"></textarea></label>
        <p class="error" id="inError" role="alert"></p>
        <button type="button" class="primary" id="inBtn">出勤を送信</button>
      </div>
    </div>

    <!-- 退勤 -->
    <div class="panel" id="outPanel">
      <div class="ph"><h2>退勤</h2><span class="badge" id="outBadge"></span><button type="button" class="link" id="outEdit">修正する</button></div>
      <p class="lock" id="outLock">出勤を送信すると、退勤を入力できます。</p>
      <div id="outBody">
        <div class="statuses two" role="group" aria-label="退勤のステータス">
          <button type="button" class="st" data-out="退勤" data-tone="out" aria-pressed="false"><b>退勤</b><span>業務終了</span></button>
          <button type="button" class="st" data-out="早退" data-tone="early" aria-pressed="false"><b>早退</b><span>早めに終了</span></button>
        </div>
        <div class="grid2">
          <label>退勤時刻<select id="end"></select></label>
          <label>休憩<select id="breakMin"></select></label>
        </div>
        <div class="grid2">
          <div class="worked"><span>実働</span><output id="worked">—</output></div>
          <div class="worked"><span>出勤時刻</span><output id="startShown">—</output></div>

          <textarea id="transport" rows="2" placeholder="例：新宿〜二子玉川　定期代　14,460円"></textarea></label>

  </div>

  <!-- 予定 -->
  <div id="viewPlan" hidden>
    <section class="card" id="planCard">
      <div class="hist-head">
        <button type="button" class="nav" id="prevPlan" aria-label="前の月">‹</button>
        <h2 id="planLabel"></h2>
        <button type="button" class="nav" id="nextPlan" aria-label="次の月">›</button>
      </div>
      <div class="legend"><span><span class="tag" data-tone="fixed">確定</span> 確定したシフト</span><span><span class="tag" data-tone="wish">希望</span> 提出した希望</span><span><span class="tag" data-tone="leave">休暇</span> 休暇の申請</span></div>
      <p class="hint">希望を出したい日をタップして選び、下の欄で内容を送信します。確定したシフトは変更できません（変更は管理者に連絡）。</p>
      <ol class="pdays" id="planList"></ol>
      <div class="editor" id="wishEditor" hidden>
        <div class="eh"><b id="wishCount"></b><button type="button" class="link" id="wishClear">選択を解除</button></div>
        <div class="seg" role="group" aria-label="希望の内容">
          <button type="button" data-wk="勤務" aria-pressed="true">勤務</button>
          <button type="button" data-wk="休み" aria-pressed="false">休み希望</button>
          <button type="button" data-wk="" aria-pressed="false">取り消す</button>
        </div>
        <div id="wishWork">
          <label class="field">シフトパターン<select id="wishPattern"></select></label>
          <div class="grid3" id="wishTimes">
            <label>開始<select id="wishStart"></select></label>
            <label>終了<select id="wishEnd"></select></label>
            <label>休憩<select id="wishBreak"></select></label>

  <!-- 申請 -->

    <section class="card">
      <h2 class="ph" style="margin:0 0 8px;font-size:1.0625rem">有給休暇の残り</h2>
      <div class="bal"><span class="big" id="balRemain">—</span><small id="balSub"></small></div>
    </section>

      <h2 style="margin:0 0 12px;font-size:1.0625rem">新しい申請</h2>
      <div class="rtypes" role="group" aria-label="申請の種類">
        <button type="button" class="st" data-rtype="有給休暇" data-tone="work" aria-pressed="false"><b>有給休暇</b><span>全日・半休</span></button>
        <button type="button" class="st" data-rtype="特別休暇" data-tone="leave" aria-pressed="false"><b>特別休暇</b><span>慶弔など</span></button>
        <button type="button" class="st" data-rtype="残業" data-tone="late" aria-pressed="false"><b>残業</b><span>事前・事後</span></button>
        <button type="button" class="st" data-rtype="打刻修正" data-tone="early" aria-pressed="false"><b>打刻修正</b><span>押し忘れ・誤り</span></button>
      </div>
      <div id="rqFields" hidden>
        <div id="rqLeave"><label class="field">区分<select id="rqUnit"><option>全日</option><option>午前半休</option><option>午後半休</option></select></label></div>
        <div class="grid2">
          <label id="rqDateLbl">日付<input type="date" id="rqDate"></label>
          <label id="rqEndWrap">終了日<input type="date" id="rqEndDate"></label>
          <label id="rqOtWrap">終了予定時刻<select id="rqOtEnd"></select></label>
        </div>
        <div class="grid3" id="rqFix">
          <label>出勤時刻<select id="rqStart"></select></label>
          <label>退勤時刻<select id="rqEnd"></select></label>
          <label>休憩<select id="rqBreak"></select></label>
        </div>
        <label class="field"><span class="lbl">理由<span class="req">必須</span></span><textarea id="rqNote" rows="2"></textarea></label>
        <p class="hint" id="rqHint"></p>
        <p class="error" id="rqError" role="alert"></p>
        <button type="button" class="primary" id="rqBtn">申請する</button>

    <section class="card">
      <h2 style="margin:0 0 4px;font-size:1.0625rem">申請の一覧</h2>

<dialog id="pwDialog" aria-labelledby="pwTitle">
  <form id="pwForm" novalidate>
    <h2 id="pwTitle">パスワード変更</h2>
    <label>現在のパスワード<input type="password" id="pwCur" autocomplete="current-password"></label>
    <label>新しいパスワード（8文字以上）<input type="password" id="pwNew" autocomplete="new-password"></label>
    <label>新しいパスワード（確認）<input type="password" id="pwNew2" autocomplete="new-password"></label>
    <p class="error" id="pwError" role="alert"></p>
    <div class="row">
      <button type="button" class="secondary" id="pwCancel">閉じる</button>
      <button type="submit" class="primary" id="pwSubmit">変更する</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ===== 設定：GASをデプロイしたら、ウェブアプリのURLをここに貼る ===== */
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbymBJhygSIJtQxwpyvkZ0CRkkdt8UG5nodPfz6w5RV4AHvNkD8bIT_n87vbTsrUxtC4ag/exec';

  const KEY = 'blks_kintai_token';
  const PLACE_KEY = 'blks_kintai_place';
  const IN = ['出勤', '遅刻'];
  const TONE = { '出勤': 'work', '遅刻': 'late', '欠勤': 'absent', '退勤': 'out', '早退': 'early', '休暇': 'leave',
    '有給休暇': 'work', '特別休暇': 'leave', '残業': 'late', '打刻修正': 'early' };
  const WD = '日月火水木金土';
  const GEO_FRESH_SEC = 120;

  const S = {
    user: null, today: '', maxDate: '', places: [], remote: '',
    date: '', ym: '', record: null,
    inKind: null, outKind: null, openIn: false, openOut: false,
    geo: null, busy: false,
    tab: 'punch', plan: null, balance: null, pending: 0,
    sched: null, planYm: '', sel: new Set(), wishKind: '勤務',
    reqs: null, rtype: null,
  };
  const $ = id => document.getElementById(id);
  let geoSeq = 0;

  /* ---------- 保存 ---------- */
  let memToken = null;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const tokenStore = {
    get() { return store.get(KEY) || memToken; },
    set(v) { memToken = v; store.set(KEY, v); },
    clear() { memToken = null; store.del(KEY); },
  };

  /* ---------- サーバー呼び出し（GAS API） ---------- */
  // Content-Type を text/plain にすると CORS のプリフライトが発生せず、GAS で受け取れる
  async function post(action, params) {
    if (GAS_API_URL.indexOf('/exec') < 0 || GAS_API_URL.indexOf('ここに') >= 0) {
      throw new Error('GAS_API_URL が設定されていません。管理者に連絡してください。');
    }
    let res;
    try {
      res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action }, params || {})),
        redirect: 'follow',
      });
    } catch (e) {
      throw new Error('サーバーに接続できません。通信環境を確認して、もう一度お試しください。');
    }
    let json;
    try { json = await res.json(); } catch (e) { throw new Error('サーバーの応答を読み取れません。管理者に連絡してください。'); }
    if (!json.ok) {
      const err = new Error(json.error || 'エラーが発生しました。');
      err.code = json.code || '';
      throw err;
    }
    return json.data;
  }
  const errMsg = e => String(e && e.message ? e.message : e);
  async function api(action, params) {
    try {
      return await post(action, Object.assign({ token: tokenStore.get() }, params || {}));
    } catch (e) {
      if (e.code === 'SESSION_EXPIRED') { showLogin(e.message); e.handled = true; }
      throw e;
    }
  }

  /* ---------- 小さな関数 ---------- */
  const pad = n => String(n).padStart(2, '0');
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const shiftMonth = (ym, n) => { const d = new Date(ym + '-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); };
  const wd = s => WD[new Date(s + 'T00:00:00Z').getUTCDay()];
  const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
  const toMin = t => { if (!t) return null; const p = t.split(':').map(Number); return p[0] * 60 + p[1]; };
  const hm = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;
  const hmJa = m => `${Math.floor(m / 60)}時間${pad(m % 60)}分`;
  const fmtStamp = s => s ? `${+s.slice(5, 7)}/${+s.slice(8, 10)} ${+s.slice(11, 13)}:${s.slice(14, 16)}` : '';
  const fmtDist = m => (m >= 1000 ? `${(m / 1000).toFixed(1)}km` : `${Math.round(m)}m`);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function nowRounded() {
    const d = new Date();
    let m = Math.round((d.getHours() * 60 + d.getMinutes()) / 15) * 15;
    if (m >= 1440) m = 1425;
    return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  }

  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
  }

  function buildOptions() {
    const times = ['<option value="">--:--</option>'];
    for (let i = 0; i < 96; i++) {
      const v = `${pad(Math.floor(i / 4))}:${pad((i % 4) * 15)}`;
      times.push(`<option value="${v}">${v}</option>`);
    }
    $('start').innerHTML = times.join('');
    $('end').innerHTML = times.join('');
    const breaks = [];
    for (let m = 0; m <= 240; m += 15) breaks.push(`<option value="${m}">${m}分</option>`);
    $('breakMin').innerHTML = breaks.join('');
    ['wishStart', 'wishEnd', 'rqOtEnd', 'rqStart', 'rqEnd'].forEach(id => { $(id).innerHTML = times.join(''); });
    ['wishBreak', 'rqBreak'].forEach(id => { $(id).innerHTML = breaks.join(''); });
  }

  /* ---------- 位置情報 ---------- */
  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error('この端末やブラウザでは位置情報を使えません。')); return; }
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: Math.round(p.coords.accuracy), at: Date.now() }),
        e => reject(new Error(e.code === 1
          ? '位置情報の利用が許可されていません。ブラウザやスマホの設定で、このページの位置情報を「許可」にしてください。'
          : '現在地を取得できませんでした。電波のよい場所で「取得し直す」を押してください。')),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    });
  }
  const isRemote = place => !!S.remote && place === S.remote;
  const geoFresh = () => S.geo && S.geo.pos && (Date.now() - S.geo.pos.at) / 1000 < GEO_FRESH_SEC;
  function geoReady() {
    const place = $('place').value;
    if (isRemote(place)) return true;
    return !!(S.geo && S.geo.place === place && S.geo.result && S.geo.result.ok);
  }

  async function locate() {
    const place = $('place').value;
    if (!place) return;
    const seq = ++geoSeq;
    if (isRemote(place)) {
      S.geo = { place: place, result: { ok: true, remote: true, message: 'リモートのため、位置の確認はありません。' } };
      render();
      return;
    }
    S.geo = { place: place, loading: true };
    render();
    try {
      const pos = await getPosition();
      if (seq !== geoSeq) return;
      const result = await api('checkLocation', { place: place, geo: pos });
      if (seq !== geoSeq) return;
      S.geo = { place: place, pos: pos, result: result };
    } catch (e) {
      if (e.handled || seq !== geoSeq) return;
      S.geo = { place: place, result: { ok: false, message: errMsg(e) } };
    }
    render();
  }

  function needLocate() {
    return !$('inBody').hidden && S.date === S.today && IN.indexOf(S.inKind) >= 0
      && (!S.geo || S.geo.place !== $('place').value || (!S.geo.loading && S.geo.pos && !geoFresh()));
  }

  /* ---------- 画面切り替え ---------- */
  function showLogin(msg) {
    tokenStore.clear();
    $('app').hidden = true;
    $('login').hidden = false;
    $('loginError').textContent = msg || '';
    $('loginEmail').focus();
  }

  async function boot() {
    const b = await api('bootstrap');
    Object.assign(S, { user: b.user, today: b.today, maxDate: b.maxDate, places: b.places || [], remote: b.remoteLabel || '' });
    $('userName').textContent = `${b.user.name} さん`;
    $('dateInput').max = b.maxDate;
    $('place').innerHTML = S.places.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    $('login').hidden = true;
    $('app').hidden = false;
    S.balance = b.balance;
    setPending(b.pending);
    showDay(b.today, b.day, b.plan);
    renderMonth(b.month);
  }

  function setPending(n) {
    S.pending = n || 0;
    $('reqCnt').textContent = S.pending;
    $('reqCnt').hidden = !S.pending;
  }

  function renderPlanLine() {
    const p = S.plan;
    const parts = [];
    if (p && p.shift) {
      const sh = p.shift;
      const label = sh.kind === '休み' ? '休み' : `${sh.pattern ? sh.pattern + ' ' : ''}${sh.start}–${sh.end}`;
      parts.push(`<span>予定</span><b>${esc(label)}</b>${sh.state === '希望' ? '<span class="tag" data-tone="wish">希望</span>' : ''}`);
    }
    if (p) {
      p.leaves.forEach(l => parts.push(`<span class="tag" data-tone="leave">${esc(l.type)}</span><span>${esc(l.unit)}・${esc(l.status)}</span>`));
      p.overtime.forEach(o => parts.push(`<span class="tag" data-tone="late">残業</span><span>${esc(o.end)}まで・${esc(o.status)}</span>`));
    }
    $('planLine').innerHTML = parts.join('<span>　</span>');
  }

  /* ---------- 1日分 ---------- */
  function showDay(date, rec, plan) {
    S.date = date;
    S.record = rec || null;
    S.plan = plan || null;
    renderPlanLine();
    S.openIn = false;
    S.openOut = false;
    S.geo = null;
    geoSeq++;
    $('dateLabel').textContent = `${+date.slice(5, 7)}月${+date.slice(8, 10)}日（${wd(date)}）`;
    $('dateInput').value = date;
    $('nextDay').disabled = date >= S.maxDate;
    $('todayBtn').hidden = date === S.today;
    fillIn();
    fillOut();
    render();
    markCurrent();
    if (needLocate()) locate();
  }

  function fillIn() {
    const r = S.record;
    const isToday = S.date === S.today;
    S.inKind = r && r.inKind ? r.inKind : null;
    const saved = store.get(PLACE_KEY);
    const place = r && r.place && S.places.indexOf(r.place) >= 0 ? r.place
      : (saved && S.places.indexOf(saved) >= 0 ? saved : (S.places[0] || ''));
    $('place').value = place;
    $('start').value = r && r.start ? r.start : (isToday ? nowRounded() : '');
    $('inNote').value = r ? (r.inNote || '') : '';
    $('inError').textContent = '';
  }

  function fillOut() {
    const r = S.record;
    S.outKind = r && r.outKind ? r.outKind : null;
    const now = nowRounded();
    const after = !(r && r.start) || toMin(now) > toMin(r.start);
    $('end').value = r && r.end ? r.end : (S.date === S.today && after ? now : '');
    $('breakMin').value = String(r && r.outKind ? r.breakMin : 0);
    $('outNote').value = r ? (r.outNote || '') : '';
    $('transport').value = r ? (r.transport || '') : '';
    $('outError').textContent = '';
  }

  function render() {
    const r = S.record;
    const isToday = S.date === S.today;
    const future = S.date > S.today;
    const past = S.date < S.today;
    const inDone = !!(r && IN.indexOf(r.inKind) >= 0);
    const absent = !!(r && r.inKind === '欠勤');
    const leave = !!(r && r.inKind === '休暇');
    const outDone = !!(r && r.outKind);

    renderSummary();
    $('inPanel').hidden = leave;

    // その日のお知らせ
    let msg = '';
    if (leave) msg = 'この日は休暇です。出勤する場合は管理者に連絡してください。';
    else if (future) msg = '先の日付は「欠勤」の事前登録だけできます（休暇は「申請」から）。';
    else if (past && !inDone && !absent) msg = '過去の日の出勤は登録できません。必要な場合は管理者に連絡してください（欠勤の登録はできます）。';
    else if (past && inDone && !outDone) msg = 'この日は退勤が送信されていません。退勤時刻を入れて送信してください。';
    $('dayMsg').textContent = msg;

    // 出勤パネル
    const inBadge = $('inBadge');
    inBadge.textContent = inDone ? `${r.inKind === '遅刻' ? '遅刻　' : ''}${r.start}　${r.place}` : absent ? '欠勤' : '未送信';
    inBadge.classList.toggle('done', inDone || absent);
    const inEditable = isToday || absent || (!inDone && !absent);
    $('inEdit').hidden = !((inDone || absent) && !S.openIn && (isToday || absent));
    $('inBody').hidden = !(((!inDone && !absent) && inEditable) || S.openIn);
    document.querySelectorAll('[data-in]').forEach(b => {
      const k = b.dataset.in;
      b.disabled = IN.indexOf(k) >= 0 ? !isToday : inDone;
      b.setAttribute('aria-pressed', String(S.inKind === k));
    });
    const inMode = IN.indexOf(S.inKind) >= 0;
    $('inFields').hidden = !inMode;
    const inNeedsReason = S.inKind === '遅刻' || S.inKind === '欠勤';
    $('inReq').hidden = !inNeedsReason;
    $('inOpt').hidden = inNeedsReason;
    const inFix = (inMode && inDone) || (S.inKind === '欠勤' && absent);
    $('inBtn').textContent = S.busy === 'in' ? '送信しています…' : `${S.inKind || '出勤'}を${inFix ? '修正して' : ''}送信`;
    $('inBtn').disabled = !!S.busy || !S.inKind || (inMode && !geoReady());
    renderGeo();

    // 退勤パネル
    $('outPanel').hidden = future || absent || leave || (past && !inDone);
    $('outLock').hidden = inDone;
    const outBadge = $('outBadge');
    outBadge.textContent = !inDone ? '' : outDone ? `${r.outKind === '早退' ? '早退　' : ''}${r.end}　実働 ${hm(Number(r.workMin) || 0)}` : '未送信';
    outBadge.classList.toggle('done', outDone);
    $('outEdit').hidden = !(outDone && !S.openOut);
    $('outBody').hidden = !inDone || (outDone && !S.openOut);
    document.querySelectorAll('[data-out]').forEach(b => b.setAttribute('aria-pressed', String(S.outKind === b.dataset.out)));
    $('outReq').hidden = S.outKind !== '早退';
    $('outOpt').hidden = S.outKind === '早退';
    $('startShown').textContent = inDone ? r.start : '—';
    $('outBtn').textContent = S.busy === 'out' ? '送信しています…' : `${S.outKind || '退勤'}を${outDone ? '修正して' : ''}送信`;
    $('outBtn').disabled = !!S.busy || !S.outKind;
    updateWorked();
  }

  function renderGeo() {
    const box = $('geo');
    const place = $('place').value;
    let cls = '', ic = '', text = '', retry = false;
    if (isRemote(place)) { ic = '–'; text = 'リモートのため、位置の確認はありません。'; }
    else if (!S.geo || S.geo.place !== place) { text = '現在地を確認します…'; cls = 'loading'; }
    else if (S.geo.loading) { cls = 'loading'; text = '現在地を確認しています…'; }
    else if (S.geo.result && S.geo.result.ok) { cls = 'ok'; ic = '✓'; text = `${S.geo.result.message}。出勤を送信できます。`; retry = true; }
    else { cls = 'ng'; ic = '!'; text = (S.geo.result && S.geo.result.message) || '現在地を確認できませんでした。'; retry = true; }
    box.className = 'geo ' + cls;
    $('geoIc').textContent = ic;
    $('geoText').textContent = text;
    $('geoRetry').hidden = !retry;
  }

  function renderSummary() {
    const r = S.record;
    const box = $('daySum');
    if (!r || !r.inKind) { box.hidden = true; return; }
    box.hidden = false;
    const absent = r.inKind === '欠勤' || r.inKind === '休暇';
    $('dsInTag').textContent = r.inKind;
    $('dsInTag').dataset.tone = TONE[r.inKind];
    $('dsInMain').textContent = r.inKind === '休暇' ? r.inNote : absent ? `理由：${r.inNote}` : `${r.start}　${r.place}`;
    $('dsInSub').textContent = absent ? `送信 ${fmtStamp(r.inAt)}`
      : `${isRemote(r.place) ? '位置確認なし' : `勤務地から約${fmtDist(Number(r.distance) || 0)}`}・送信 ${fmtStamp(r.inAt)}`;
    $('dsOut').hidden = !r.outKind;
    if (r.outKind) {
      $('dsOutTag').textContent = r.outKind;
      $('dsOutTag').dataset.tone = TONE[r.outKind];
      $('dsOutMain').textContent = `${r.end}　実働 ${hm(Number(r.workMin) || 0)}`;
      $('dsOutSub').textContent = `休憩${r.breakMin}分・送信 ${fmtStamp(r.outAt)}`;
    }
    const lastOut = !!r.outKind;
    $('stampStatus').textContent = lastOut ? r.outKind : r.inKind;
    $('stampTime').textContent = fmtStamp(lastOut ? r.outAt : r.inAt);
  }

  function popStamp() {
    const s = $('stamp');
    s.classList.remove('pop');
    void s.offsetWidth;
    s.classList.add('pop');
  }

  function updateWorked() {
    const o = $('worked');
    const r = S.record;
    const s = r && r.start ? toMin(r.start) : null;
    const e = toMin($('end').value);
    const b = Number($('breakMin').value) || 0;
    if (s == null || e == null) { o.textContent = '—'; return; }
    if (e <= s) { o.textContent = '時刻を確認'; return; }
    if (b >= e - s) { o.textContent = '休憩を確認'; return; }
    o.textContent = hmJa(e - s - b);
  }

  async function goDay(date) {
    if (S.busy || !date || date > S.maxDate) return;
    $('entry').classList.add('loading');
    try {
      const res = await api('day', { date: date });
      showDay(date, res.record, res.plan);
      if (date.slice(0, 7) !== S.ym) renderMonth(await api('month', { ym: date.slice(0, 7) }));
    } catch (e) {
      if (!e.handled) toast(errMsg(e));
    } finally {
      $('entry').classList.remove('loading');
    }
  }

  async function afterSave(res) {
    S.record = res.record;
    S.geo = null;
    geoSeq++;
    S.openIn = false;
    S.openOut = false;
    fillIn();
    fillOut();
    render();
    popStamp();
    const fix = res.kind === '修正' ? 'の修正' : '';
    toast(res.mailSent
      ? `${res.action}${fix}を送信し、管理者にメールしました。`
      : `${res.action}${fix}を保存しました。管理者へのメール送信に失敗したため、直接ご連絡ください。`);
    if (S.date.slice(0, 7) === S.ym) {
      try { renderMonth(await api('month', { ym: S.ym })); } catch (e) {}
    }
  }

  async function submitIn() {
    if (S.busy) return;
    const err = $('inError');
    err.textContent = '';
    if (!S.inKind) { err.textContent = '「出勤」「遅刻」「欠勤」のどれかを選んでください。'; return; }
    const note = $('inNote').value.trim();
    if ((S.inKind === '遅刻' || S.inKind === '欠勤') && !note) {
      err.textContent = `${S.inKind}の理由を入力してください。`;
      $('inNote').focus();
      return;
    }
    S.busy = 'in';
    render();
    try {
      let res;
      if (S.inKind === '欠勤') {
        res = await api('absent', { entry: { date: S.date, note: note } });
      } else {
        const place = $('place').value;
        const start = $('start').value;
        if (!start) throw new Error('出勤時刻を選んでください。');
        if (!isRemote(place) && !geoFresh()) await locate();
        if (!geoReady()) throw new Error((S.geo && S.geo.result && S.geo.result.message) || '現在地を確認できていません。');
        res = await api('checkIn', { entry: {
          date: S.date, kind: S.inKind, place: place, start: start, note: note,
          geo: isRemote(place) ? null : S.geo.pos,
        } });
        store.set(PLACE_KEY, place);
      }
      S.busy = false;
      await afterSave(res);
    } catch (e) {
      S.busy = false;
      render();
      if (!e.handled) err.textContent = errMsg(e);
    }
  }

  async function submitOut() {
    if (S.busy) return;
    const err = $('outError');
    err.textContent = '';
    if (!S.outKind) { err.textContent = '「退勤」か「早退」を選んでください。'; return; }
    const note = $('outNote').value.trim();
    if (S.outKind === '早退' && !note) { err.textContent = '早退の理由を入力してください。'; $('outNote').focus(); return; }
    const end = $('end').value;
    if (!end) { err.textContent = '退勤時刻を選んでください。'; return; }
    const r = S.record;
    if (r && r.start && toMin(end) <= toMin(r.start)) { err.textContent = `退勤時刻は、出勤時刻（${r.start}）より後にしてください。`; return; }
    S.busy = 'out';
    render();
    try {
      const res = await api('checkOut', { entry: {
        date: S.date, kind: S.outKind, end: end, breakMin: Number($('breakMin').value) || 0,
        note: note, transport: $('transport').value,
      } });
      S.busy = false;
      await afterSave(res);
    } catch (e) {
      S.busy = false;
      render();
      if (!e.handled) err.textContent = errMsg(e);
    }
  }

  /* ---------- 今月の稼働 ---------- */
  function renderMonth(m) {
    S.ym = m.ym;
    $('monthLabel').textContent = `${m.ym.slice(0, 4)}年${+m.ym.slice(5)}月の稼働`;
    $('nextMonth').disabled = m.ym >= S.maxDate.slice(0, 7);
    const c = m.counts;
    const parts = [`実働 ${hmJa(m.totalMin)}`, `出勤 ${c.worked}日`, `遅刻 ${c.late}日`, `早退 ${c.early}日`, `欠勤 ${c.absent}日`, `休暇 ${c.leave || 0}日`];
    $('monthSummary').innerHTML = m.records.length
      ? parts.map(t => `<span>${esc(t)}</span>`).join('') + (c.noOut ? `<span class="warn">退勤未送信 ${c.noOut}日</span>` : '')
      : '';
    $('monthList').innerHTML = m.records.length
      ? m.records.map(r => {
          const chips = [r.inKind, r.outKind].filter(Boolean).map(k => `<span class="tag" data-tone="${TONE[k] || ''}">${esc(k)}</span>`).join('');
          let t = '';
          if (r.inKind === '欠勤' || r.inKind === '休暇') t = '';
          else if (r.start) t = `${esc(r.start)}–${esc(r.end || '')}<small>${esc(r.place)}</small>`;
          const w = r.workMin === '' || r.workMin == null ? '' : hm(Number(r.workMin));
          return `<li><button type="button" class="day" data-date="${esc(r.date)}">`
            + `<span>${md(r.date)}（${wd(r.date)}）</span><span class="chips">${chips}</span>`
            + `<span class="t">${t}</span><span class="w">${w}</span></button></li>`;
        }).join('')
      : '<li class="empty">この月の記録はまだありません。</li>';
    markCurrent();
  }

  function markCurrent() {
    document.querySelectorAll('.day').forEach(b => {
      if (b.dataset.date === S.date) b.setAttribute('aria-current', 'date');
      else b.removeAttribute('aria-current');
    });
  }

  async function loadMonth(ym) {
    $('history').classList.add('loading');
    try { renderMonth(await api('month', { ym: ym })); }
    catch (e) { if (!e.handled) toast(errMsg(e)); }
    finally { $('history').classList.remove('loading'); }
  }


  /* ---------- タブ ---------- */
  function showTab(tab) {
    S.tab = tab;
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    $('viewPunch').hidden = tab !== 'punch';
    $('viewPlan').hidden = tab !== 'plan';
    $('viewReq').hidden = tab !== 'req';
    if (tab === 'plan' && !S.sched) loadSchedule(S.today.slice(0, 7));
    if (tab === 'req') loadRequests();
    window.scrollTo({ top: 0 });
  }

  /* ---------- 予定（シフト） ---------- */
  async function loadSchedule(ym) {
    $('planCard').classList.add('loading');
    try {
      S.sched = await api('schedule', { ym: ym });
      S.planYm = ym;
      S.sel.clear();
      renderSchedule();
    } catch (e) { if (!e.handled) toast(errMsg(e)); }
    finally { $('planCard').classList.remove('loading'); }
  }

  function shiftText(sh) {
    if (!sh) return '';
    return sh.kind === '休み' ? '休み' : `${sh.pattern ? sh.pattern + ' ' : ''}${sh.start}–${sh.end}`;
  }

  function editableDay(date) {
    const sc = S.sched;
    const sh = sc.shifts.find(x => x.date === date);
    return date > sc.today && date <= sc.maxDate && !(sh && sh.state === '確定');
  }

  function renderSchedule() {
    const sc = S.sched;
    const ym = sc.ym;
    $('planLabel').textContent = `${ym.slice(0, 4)}年${+ym.slice(5)}月の予定`;
    $('nextPlan').disabled = ym >= sc.maxDate.slice(0, 7);
    const y = +ym.slice(0, 4), m = +ym.slice(5);
    const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const items = [];
    for (let d = 1; d <= days; d++) {
      const date = `${ym}-${pad(d)}`;
      const sh = sc.shifts.find(x => x.date === date);
      const lv = sc.leaves.filter(x => x.date === date);
      const off = sc.workdays.indexOf(wd(date)) < 0;
      let v = '';
      if (sh) v += `<span class="tag" data-tone="${sh.state === '確定' ? 'fixed' : 'wish'}">${sh.state}</span><span>${esc(shiftText(sh))}</span>${sh.note ? `<small>${esc(sh.note)}</small>` : ''}`;
      lv.forEach(l => { v += `<span class="tag" data-tone="leave">${esc(l.type)}</span><small>${esc(l.unit)}・${esc(l.status)}</small>`; });
      if (!v) v = `<small>${off ? '勤務曜日外' : '—'}</small>`;
      const can = editableDay(date);
      items.push(`<li><button type="button" class="pday${off ? ' off' : ''}" data-date="${date}" aria-pressed="${S.sel.has(date)}" ${can ? '' : 'disabled'}>`
        + `<span class="ck">✓</span><span class="pd">${md(date)}（${wd(date)}）</span><span class="pv">${v}</span></button></li>`);
    }
    $('planList').innerHTML = items.join('');
    $('wishPattern').innerHTML = sc.patterns.map(p => `<option value="${esc(p.name)}">${esc(p.name)}（${p.start}–${p.end}）</option>`).join('')
      + '<option value="">時間を指定する</option>';
    renderWishEditor();
  }

  function renderWishEditor() {
    const n = S.sel.size;
    $('wishEditor').hidden = !n;
    if (!n) return;
    const list = [...S.sel].sort().map(d => md(d));
    $('wishCount').textContent = `選んだ日：${n}日（${list.slice(0, 6).join('、')}${n > 6 ? ' ほか' : ''}）`;
    document.querySelectorAll('[data-wk]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.wk === S.wishKind)));
    $('wishWork').hidden = S.wishKind !== '勤務';
    $('wishTimes').hidden = $('wishPattern').value !== '';
    $('wishNoteWrap').hidden = S.wishKind === '';
    $('wishBtn').textContent = S.wishKind === '' ? '希望を取り消す' : '希望を送信';
  }

  async function submitWish() {
    const err = $('wishError');
    err.textContent = '';
    const kind = S.wishKind;
    const pattern = $('wishPattern').value;
    const base = { kind: kind, note: $('wishNote').value.trim() };
    if (kind === '勤務') {
      if (pattern) base.pattern = pattern;
      else {
        Object.assign(base, { start: $('wishStart').value, end: $('wishEnd').value, breakMin: Number($('wishBreak').value) || 0 });
        if (!base.start || !base.end) { err.textContent = '開始時刻と終了時刻を選んでください。'; return; }
      }
    }
    const entries = [...S.sel].sort().map(date => Object.assign({ date: date }, base));
    $('wishBtn').disabled = true;
    try {
      const res = await api('shiftWish', { entries: entries });
      S.sched = res.schedule;
      S.sel.clear();
      $('wishNote').value = '';
      renderSchedule();
      toast(res.locked.length ? `${res.changed}日分を送信しました（確定済みの${res.locked.length}日は変更していません）。` : `${res.changed}日分の希望を送信しました。`);
    } catch (e) { if (!e.handled) err.textContent = errMsg(e); }
    finally { $('wishBtn').disabled = false; }
  }

  /* ---------- 申請 ---------- */
  async function loadRequests() {
    try {
      const data = await api('requests');
      renderRequests(data);
    } catch (e) { if (!e.handled) toast(errMsg(e)); }
  }

  const fmtDays = n => (Math.round(n * 10) / 10).toString();

  function renderRequests(data) {
    S.reqs = data;
    S.balance = data.balance;
    const b = data.balance;
    $('balRemain').textContent = `${fmtDays(b.remaining)}日`;
    const sub = [`付与 ${fmtDays(b.granted)}日・取得 ${fmtDays(b.used)}日`];
    if (b.pending) sub.push(`申請中 ${fmtDays(b.pending)}日`);
    if (b.nextExpire) sub.push(`${b.nextExpire.date.replace(/-/g, '/')}に${fmtDays(b.nextExpire.days)}日が失効予定`);
    $('balSub').textContent = sub.join('　');
    ['rqDate', 'rqEndDate'].forEach(id => { $(id).min = data.minDate; $(id).max = data.maxDate; });
    setPending(data.requests.filter(r => r.status === '申請中').length);
    $('reqList').innerHTML = data.requests.length ? data.requests.map(r => `<li>
      <div class="rq-h"><span class="tag" data-tone="${TONE[r.type] || ''}">${esc(r.type)}</span><span class="stt s-${esc(r.status)}">${esc(r.status)}</span></div>
      <div class="rq-b">${esc(r.label)}</div>
      <div class="rq-n">理由：${esc(r.note)}</div>
      ${r.comment ? `<div class="rq-c">管理者：${esc(r.comment)}</div>` : ''}
      <div class="rq-f"><span>申請 ${fmtStamp(r.appliedAt)}</span>${r.status === '申請中' ? `<button type="button" class="link" data-cancel="${esc(r.id)}">取り消す</button>` : ''}</div>
    </li>`).join('') : '<li class="empty">まだ申請はありません。</li>';
    renderReqForm();
  }

  function renderReqForm() {
    const t = S.rtype;
    document.querySelectorAll('[data-rtype]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.rtype === t)));
    $('rqFields').hidden = !t;
    if (!t) return;
    const leave = t === '有給休暇' || t === '特別休暇';
    $('rqLeave').hidden = !leave;
    $('rqEndWrap').hidden = !(leave && $('rqUnit').value === '全日');
    $('rqOtWrap').hidden = t !== '残業';
    $('rqFix').hidden = t !== '打刻修正';
    $('rqDateLbl').firstChild.textContent = leave && $('rqUnit').value === '全日' ? '開始日' : '日付';
    const hints = {
      '有給休暇': `残り${S.balance ? fmtDays(S.balance.remaining - S.balance.pending) : '—'}日（申請中を除く）。全日は期間内の勤務日だけを数えます（祝日・休業日・勤務曜日外は除外）。`,
      '特別休暇': '慶弔休暇など。日数の上限は管理者が確認します。',
      '残業': '終了予定時刻を選んでください。7日前までの事後申請もできます。',
      '打刻修正': '承認されると、その日の出勤・退勤時刻が申請どおりに直ります（位置確認なし）。',
    };
    $('rqHint').textContent = hints[t];
    $('rqBtn').textContent = `${t}を申請する`;
  }

  async function submitRequest() {
    const err = $('rqError');
    err.textContent = '';
    const t = S.rtype;
    const entry = { type: t, date: $('rqDate').value, note: $('rqNote').value.trim() };
    if (!entry.date) { err.textContent = '日付を選んでください。'; return; }
    if (!entry.note) { err.textContent = '理由を入力してください。'; $('rqNote').focus(); return; }
    if (t === '有給休暇' || t === '特別休暇') {
      entry.unit = $('rqUnit').value;
      if (entry.unit === '全日') entry.endDate = $('rqEndDate').value || entry.date;
    } else if (t === '残業') {
      entry.end = $('rqOtEnd').value;
      if (!entry.end) { err.textContent = '終了予定時刻を選んでください。'; return; }
    } else {
      Object.assign(entry, { start: $('rqStart').value, end: $('rqEnd').value, breakMin: Number($('rqBreak').value) || 0 });
      if (!entry.start) { err.textContent = '正しい出勤時刻を選んでください。'; return; }
    }
    $('rqBtn').disabled = true;
    try {
      const data = await api('request', { entry: entry });
      $('rqNote').value = '';
      S.rtype = null;
      renderRequests(data);
      toast(`${t}を申請しました。結果はメールでお知らせします。`);
      window.scrollTo({ top: document.getElementById('reqList').offsetTop - 80, behavior: 'smooth' });
    } catch (e) { if (!e.handled) err.textContent = errMsg(e); }
    finally { $('rqBtn').disabled = false; }
  }

  /* ---------- イベント ---------- */
  $('loginForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('loginError').textContent = '';
    $('loginBtn').disabled = true;
    try {
      const r = await post('login', { email: $('loginEmail').value, password: $('loginPass').value });
      tokenStore.set(r.token);
      $('loginPass').value = '';
      await boot();
    } catch (e) {
      if (!e.handled) $('loginError').textContent = errMsg(e);
    } finally {
      $('loginBtn').disabled = false;
    }
  });

  $('logoutBtn').addEventListener('click', async () => {
    try { await post('logout', { token: tokenStore.get() }); } catch (e) {}
    showLogin('ログアウトしました。');
  });

  document.querySelectorAll('[data-in]').forEach(b => b.addEventListener('click', () => {
    S.inKind = b.dataset.in;
    $('inError').textContent = '';
    render();
    if (needLocate()) locate();
  }));
  document.querySelectorAll('[data-out]').forEach(b => b.addEventListener('click', () => {
    S.outKind = b.dataset.out;
    $('outError').textContent = '';
    render();
  }));
  $('place').addEventListener('change', () => { $('inError').textContent = ''; locate(); });
  $('geoRetry').addEventListener('click', () => locate());
  ['end', 'breakMin'].forEach(id => $(id).addEventListener('change', updateWorked));
  $('inEdit').addEventListener('click', () => { S.openIn = true; S.geo = null; geoSeq++; render(); if (needLocate()) locate(); });
  $('outEdit').addEventListener('click', () => { S.openOut = true; render(); });
  $('inBtn').addEventListener('click', submitIn);
  $('outBtn').addEventListener('click', submitOut);

  $('prevDay').addEventListener('click', () => goDay(addDays(S.date, -1)));
  $('nextDay').addEventListener('click', () => goDay(addDays(S.date, 1)));
  $('todayBtn').addEventListener('click', () => goDay(S.today));
  $('dateInput').addEventListener('change', e => { if (e.target.value) goDay(e.target.value); });
  $('dateInput').addEventListener('click', e => { try { e.target.showPicker(); } catch (err) {} });


  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  $('prevPlan').addEventListener('click', () => loadSchedule(shiftMonth(S.planYm, -1)));
  $('nextPlan').addEventListener('click', () => loadSchedule(shiftMonth(S.planYm, 1)));
  $('planList').addEventListener('click', e => {
    const b = e.target.closest('.pday');
    if (!b || b.disabled) return;
    const d = b.dataset.date;
    if (S.sel.has(d)) S.sel.delete(d); else S.sel.add(d);
    b.setAttribute('aria-pressed', String(S.sel.has(d)));
    $('wishError').textContent = '';
    renderWishEditor();
  });
  $('wishClear').addEventListener('click', () => { S.sel.clear(); renderSchedule(); });
  document.querySelectorAll('[data-wk]').forEach(b => b.addEventListener('click', () => { S.wishKind = b.dataset.wk; renderWishEditor(); }));
  $('wishPattern').addEventListener('change', renderWishEditor);
  $('wishBtn').addEventListener('click', submitWish);

  document.querySelectorAll('[data-rtype]').forEach(b => b.addEventListener('click', () => {
    S.rtype = b.dataset.rtype;
    $('rqError').textContent = '';
    if (!$('rqDate').value) $('rqDate').value = S.rtype === '打刻修正' ? addDays(S.today, -1) : S.today;
    renderReqForm();
  }));
  $('rqUnit').addEventListener('change', renderReqForm);
  $('rqBtn').addEventListener('click', submitRequest);
  $('reqList').addEventListener('click', async e => {
    const b = e.target.closest('[data-cancel]');
    if (!b) return;
    b.disabled = true;
    try { renderRequests(await api('cancelRequest', { id: b.dataset.cancel })); toast('申請を取り消しました。'); }
    catch (err) { if (!err.handled) toast(errMsg(err)); b.disabled = false; }
  });
  $('prevMonth').addEventListener('click', () => loadMonth(shiftMonth(S.ym, -1)));
  $('nextMonth').addEventListener('click', () => loadMonth(shiftMonth(S.ym, 1)));
  $('monthList').addEventListener('click', e => {
    const b = e.target.closest('.day');
    if (!b) return;
    goDay(b.dataset.date);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('pwBtn').addEventListener('click', () => { $('pwForm').reset(); $('pwError').textContent = ''; $('pwDialog').showModal(); });
  $('pwCancel').addEventListener('click', () => $('pwDialog').close());
  $('pwForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('pwError').textContent = '';
    if ($('pwNew').value !== $('pwNew2').value) { $('pwError').textContent = '確認用のパスワードが一致しません。'; return; }
    $('pwSubmit').disabled = true;
    try {
      await api('changePassword', { current: $('pwCur').value, next: $('pwNew').value });
      $('pwDialog').close();
      toast('パスワードを変更しました。');
    } catch (e) {
      if (!e.handled) $('pwError').textContent = errMsg(e);
      else $('pwDialog').close();
    } finally {
      $('pwSubmit').disabled = false;
    }
  });

  /* ---------- 起動 ---------- */
  buildOptions();
  if (tokenStore.get()) boot().catch(e => { if (!e.handled) showLogin(errMsg(e)); });
  else showLogin();
})();
</script>
</body>
</html>
